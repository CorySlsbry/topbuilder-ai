# =============================================================================
# Cloud Build pipeline — builds container, pushes to Artifact Registry,
# deploys to Cloud Run, deploys Firestore rules + indexes + Storage rules.
# =============================================================================
# Triggered by:
#   - push to main      -> deploys to builder-ai-497610 (Top Builder AI)
#   - manual            -> use --substitutions to override
#
# Required Cloud Build trigger substitutions:
#   _REGION             default: us-central1
#   _SERVICE_NAME       default: topbuilder-ai-web
#   _PROJECT_ID         (resolved from $PROJECT_ID by Cloud Build)
# =============================================================================

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: topbuilder-ai-web
  _ENV: prod
  _ARTIFACT_REPO: topbuilder-ai
  # Firebase WEB client config — PUBLIC (not secrets). Must be baked at BUILD
  # time: Next.js inlines NEXT_PUBLIC_* into the client bundle during
  # `next build`, so setting them only as Cloud Run runtime env vars leaves the
  # browser with empty config -> auth/invalid-api-key on every login. Security
  # is enforced by Firebase Rules/Auth/App Check, not by hiding these.
  _FB_API_KEY: REDACTED
  _FB_AUTH_DOMAIN: builder-ai-497610.firebaseapp.com
  _FB_PROJECT_ID: builder-ai-497610
  _FB_STORAGE_BUCKET: builder-ai-497610.firebasestorage.app
  _FB_MESSAGING_SENDER_ID: '840472456279'
  _FB_APP_ID: '1:840472456279:web:6863457391e30959c20712'
  _APP_URL: https://topbuilderai.com
  # Non-secret runtime config (OAuth client IDs are public identifiers; the
  # SECRETS live in Secret Manager and are wired via --set-secrets below).
  # Enumerated here so cloudbuild.yaml is the single authoritative source of the
  # Cloud Run env — `--set-env-vars` replaces the full set on every deploy.
  _KMS_KEY_NAME: projects/builder-ai-497610/locations/us-central1/keyRings/topbuilder/cryptoKeys/token-encryption-key
  _PROCORE_CLIENT_ID: BS9aq1o29W6Hiv_vIhet9rFK8nY6ee8BKU2jDffcezs
  _QBO_CLIENT_ID: ABYV2DgHJFkjrDJR3jrY3FwIOM8jdWiWqceAFem5rgvkxICzyB
  _QBO_ENVIRONMENT: sandbox
  _STRIPE_PRICE_STARTER: REDACTED
  _STRIPE_PRICE_PRO: REDACTED
  # Platform support agent model (Sonnet 4.7; 404s fall back to default Sonnet).
  _ANTHROPIC_MODEL_SUPPORT: claude-sonnet-4-7
  # HMAC key for CAN-SPAM one-click unsubscribe links. Server-only (not in the
  # client bundle). Rotate into Secret Manager if you want it out of git.
  _EMAIL_UNSUBSCRIBE_SECRET: REDACTED
  # Where platform/support + lead notifications are sent.
  _FOUNDER_NOTIFICATION_EMAIL: cory@salisburybookkeeping.com

steps:
  # ---------------------------------------------------------------------------
  # 1. Build the web container
  # ---------------------------------------------------------------------------
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/web:$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/web:${_ENV}-latest
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_FB_API_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FB_AUTH_DOMAIN}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FB_PROJECT_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FB_STORAGE_BUCKET}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FB_MESSAGING_SENDER_ID}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_FB_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_APP_URL}
      - --file
      - apps/web/Dockerfile
      - .

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/web

  # ---------------------------------------------------------------------------
  # 2. Build the worker container (Cloud Run Jobs)
  # ---------------------------------------------------------------------------
  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/worker:$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/worker:${_ENV}-latest
      - --file
      - apps/worker/Dockerfile
      - .

  - id: push-worker
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/worker

  # ---------------------------------------------------------------------------
  # 3. Deploy web service to Cloud Run
  # ---------------------------------------------------------------------------
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/web:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --service-account
      - topbuilder-web@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --min-instances=1
      - --max-instances=20
      - --cpu=1
      - --memory=1Gi
      - --concurrency=80
      - --timeout=300
      - --port=8080
      # Complete authoritative runtime env. NOTE: --set-env-vars REPLACES the
      # full set, so EVERY required var must be listed here — a missing one is
      # silently absent on the live service (this is exactly how KMS_KEY_NAME /
      # WORKER_SERVICE_ACCOUNT_EMAIL / runtime NEXT_PUBLIC_APP_URL went missing
      # before this audit). No value here contains a comma.
      - --set-env-vars
      - GCP_PROJECT=$PROJECT_ID,GCP_LOCATION=${_REGION},NEXT_PUBLIC_FIREBASE_EMULATORS=0,NEXT_PUBLIC_APP_URL=${_APP_URL},KMS_KEY_NAME=${_KMS_KEY_NAME},WORKER_SERVICE_ACCOUNT_EMAIL=topbuilder-worker@$PROJECT_ID.iam.gserviceaccount.com,PROCORE_CLIENT_ID=${_PROCORE_CLIENT_ID},PROCORE_API_BASE_URL=https://api.procore.com,PROCORE_LOGIN_URL=https://login.procore.com,QBO_CLIENT_ID=${_QBO_CLIENT_ID},QBO_ENVIRONMENT=${_QBO_ENVIRONMENT},ANTHROPIC_MODEL_DEFAULT=claude-sonnet-4-6,ANTHROPIC_MODEL_COMPLEX=claude-opus-4-7,ANTHROPIC_MODEL_FAST=claude-haiku-4-5,ANTHROPIC_MODEL_SUPPORT=${_ANTHROPIC_MODEL_SUPPORT},EMAIL_UNSUBSCRIBE_SECRET=${_EMAIL_UNSUBSCRIBE_SECRET},FOUNDER_NOTIFICATION_EMAIL=${_FOUNDER_NOTIFICATION_EMAIL},STRIPE_PRICE_STARTER=${_STRIPE_PRICE_STARTER},STRIPE_PRICE_PRO=${_STRIPE_PRICE_PRO}
      # Secrets — only secrets that EXIST in Secret Manager. (stripe-secret-key
      # is intentionally absent: live Stripe billing is a deferred manual step;
      # billing routes 500 by design until it's added — see NEEDS-CORY.)
      - --set-secrets
      - PROCORE_CLIENT_SECRET=procore-client-secret:latest,PROCORE_WEBHOOK_SECRET=procore-webhook-secret:latest,QBO_CLIENT_SECRET=qbo-client-secret:latest,QBO_WEBHOOK_VERIFIER_TOKEN=qbo-webhook-verifier-token:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,RESEND_API_KEY=resend-api-key:latest

  # ---------------------------------------------------------------------------
  # 4. Update worker job image (if exists)
  # ---------------------------------------------------------------------------
  - id: update-worker-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs describe procore-initial-sync --region=${_REGION} >/dev/null 2>&1 && \
          gcloud run jobs update procore-initial-sync \
            --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/worker:$SHORT_SHA \
            --region=${_REGION} || echo "procore-initial-sync job not yet created — skipping"

  # Note: Firestore rules + indexes + Storage rules are deployed separately via
  # `pnpm deploy:rules` (firebase CLI), NOT as a Cloud Build step. The
  # gcr.io/$PROJECT_ID/firebase image doesn't exist in fresh projects, and
  # rebuilding it adds complexity for a flow that only needs to fire when rules
  # change (which is rare relative to code pushes).

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/web:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/web:${_ENV}-latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/worker:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/worker:${_ENV}-latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
